<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column like a game board; letter tiles are the hero, everything else stays quiet. */
:root {
  --bg: #E7ECE3; --surface: #F6F8F2; --ink: #1B2924; --muted: #56675F; --line: #C9D4CA;
  --tile: #FFF6DF; --tile-ink: #2B2416; --tile-edge: #CDB783;
  --pandan: #23704F; --pandan-ink: #FFFFFF; --kunyit: #B97C0C; --kunyit-soft: #F5E2B3;
  --bad: #B23E2D; --bad-soft: #F6D9D3; --good-soft: #D3EBDD;
  --banner-bg: #1E3A2F; --banner-ink: #F1F5EE;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1B17; --surface: #172620; --ink: #E5EEE8; --muted: #94A79D; --line: #2A3E35;
    --tile: #F1E5C4; --tile-ink: #2B2416; --tile-edge: #9C8247;
    --pandan: #47B385; --pandan-ink: #0B1712; --kunyit: #E8B23C; --kunyit-soft: #3B3015;
    --bad: #E8735F; --bad-soft: #3D1F1A; --good-soft: #17382A;
    --banner-bg: #E4ECE5; --banner-ink: #13201B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1B17; --surface: #172620; --ink: #E5EEE8; --muted: #94A79D; --line: #2A3E35;
  --tile: #F1E5C4; --tile-ink: #2B2416; --tile-edge: #9C8247;
  --pandan: #47B385; --pandan-ink: #0B1712; --kunyit: #E8B23C; --kunyit-soft: #3B3015;
  --bad: #E8735F; --bad-soft: #3D1F1A; --good-soft: #17382A;
  --banner-bg: #E4ECE5; --banner-ink: #13201B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
#game, #result { max-width: 720px; margin-inline: auto; }
.wrap { max-width: 1000px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .lvl:focus-visible { outline: 3px solid var(--kunyit); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.1; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* tiles */
.tile {
  display: inline-grid; place-items: center; background: var(--tile); color: var(--tile-ink);
  font-family: var(--font-display); font-weight: 800; border: 0; border-radius: 10px;
  box-shadow: 0 3px 0 var(--tile-edge); position: relative; user-select: none;
}
.tile sub { position: absolute; right: 5px; bottom: 2px; font-size: 9px; font-weight: 600; opacity: .55; }

/* menu */
.top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: start; padding-block: 8px 22px; }
.title { font-size: clamp(48px, 12vw, 84px); font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
.title mark { background: linear-gradient(transparent 60%, var(--kunyit) 60%); color: inherit; padding-inline: 4px; }
.lede { font-size: 18px; color: var(--muted); margin: 14px 0 0; max-width: 56ch; }
.bestcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 20px; display: grid; gap: 10px; min-width: 240px; }
.bestcard .v { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--pandan); font-weight: 700; text-align: left; }
.linkbtn:hover { text-decoration: underline; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.ctl { display: flex; align-items: center; gap: 10px; }
.lvlseg { display: flex; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
.lvlseg button { border: 0; background: transparent; padding: 9px 14px; border-radius: 10px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
.lvlseg button:hover { color: var(--ink); }
.lvlseg button[aria-pressed="true"] { background: var(--pandan); color: var(--pandan-ink); }
#lvl-ultra { color: var(--bad); }
#lvl-ultra[aria-pressed="true"] { background: var(--bad); color: var(--pandan-ink); }
.bars { display: inline-flex; gap: 2px; }
.bars i { width: 5px; height: 14px; border-radius: 2px; background: currentColor; opacity: .3; }
.bars i.on { opacity: 1; }
.lvldesc { flex: 1 1 240px; min-width: 0; margin: 0; color: var(--muted); }
.toggles { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { border: 1.5px solid var(--line); background: transparent; border-radius: 12px; padding: 8px 14px; font-weight: 700; white-space: nowrap; }
.pill[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.banner { margin-top: 22px; background: var(--banner-bg); color: var(--banner-ink); border-radius: 18px; padding: 22px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
.banner > div { flex: 1 1 260px; min-width: 0; }
.banner h2 { font-size: clamp(24px, 6vw, 30px); }
.banner p { margin: 6px 0 0; opacity: .8; }
.btn-cta { background: var(--kunyit); color: var(--tile-ink); border: 0; border-radius: 14px; padding: 14px 26px; font-family: var(--font-display); font-weight: 800; font-size: 18px; }
.btn-cta:hover { filter: brightness(1.06); }
.practice { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.pcard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 4px; align-content: start; transition: transform .12s, border-color .12s; }
.pcard:hover { transform: translateY(-2px); border-color: var(--pandan); }
.pcard b { font-family: var(--font-display); font-size: 18px; }
.pcard span { color: var(--muted); font-size: 14px; }
.pcard small { color: var(--pandan); font-weight: 700; font-size: 12px; }
.section { display: grid; gap: 10px; margin-top: 26px; }
@media (max-width: 640px) {
  .top { grid-template-columns: 1fr; }
  .bestcard { min-width: 0; }
  .btn-cta { width: 100%; }
}

/* game */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.chip { background: var(--kunyit-soft); color: var(--ink); border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 700; }
.bar .spacer { flex: 1; }
.stat { display: grid; line-height: 1.1; text-align: right; }
.stat b { font-family: var(--font-display); font-size: 22px; }
.hearts { display: flex; gap: 2px; }
.hearts svg { width: 20px; height: 20px; }
.hearts .full { fill: var(--bad); } .hearts .empty { fill: var(--line); }
.timer { margin-top: 14px; height: 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--pandan); transform-origin: left; }
.timer.low i { background: var(--bad); }
.timer-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 4px; }

.card { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px 18px; display: grid; gap: 16px; }
.qhead { display: grid; gap: 4px; }
.qhead h2 { font-size: 24px; }
.qhead p { margin: 0; color: var(--muted); }
.clue { background: var(--bg); border-radius: 12px; padding: 12px 14px; font-size: 17px; font-weight: 600; }
.clue .label { display: block; margin-bottom: 2px; }
.prompt-word { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding-block: 6px; }

.slots { display: grid; gap: 6px; justify-content: center; }
.slot { aspect-ratio: 5/6; width: 100%; border-radius: 10px; border: 2px dashed var(--line); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: clamp(14px, 5vw, 26px); background: transparent; padding: 0; }
.slot.filled { border: 0; background: var(--tile); color: var(--tile-ink); box-shadow: 0 3px 0 var(--tile-edge); }
.slot.locked { background: var(--kunyit); }
.rack { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.rack .tile { width: 48px; height: 54px; font-size: 26px; transition: transform .1s, opacity .1s; }
.rack .tile:hover:not(:disabled) { transform: translateY(-2px); }
.rack .tile:disabled { opacity: .18; box-shadow: none; cursor: default; }
.mini { width: clamp(26px, 9vw, 42px); height: clamp(32px, 10.5vw, 48px); font-size: clamp(16px, 5vw, 24px); }
.mini.blank { background: transparent; border: 2px dashed var(--kunyit); box-shadow: none; color: var(--kunyit); }
.mini.reveal { background: var(--kunyit); }

.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt {
  border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 14px 12px;
  font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: .02em;
  display: flex; align-items: center; gap: 10px; text-align: left; min-width: 0; overflow-wrap: anywhere;
}
.opt kbd { font-family: var(--font-body); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; flex: none; }
.opt:hover:not(:disabled) { border-color: var(--pandan); }
.opt.ok { background: var(--good-soft); border-color: var(--pandan); }
.opt.no { background: var(--bad-soft); border-color: var(--bad); }
.opt.gone { opacity: .25; }
.opt:disabled { cursor: default; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; margin-top: 14px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--pandan); color: var(--pandan-ink); border-color: var(--pandan); }
.btn.warn { border-color: var(--bad); color: var(--bad); }

.reveal { border-radius: 14px; padding: 14px 16px; display: grid; gap: 4px; cursor: pointer; }
.reveal.good { background: var(--good-soft); }
.reveal.bad { background: var(--bad-soft); }
.reveal strong { font-family: var(--font-display); font-size: 20px; }
.reveal .pair { font-weight: 700; }
.reveal small { color: var(--muted); }

.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.pop { animation: pop .3s; }
@keyframes pop { 50% { transform: scale(1.04); } }

/* result */
.result-top { display: grid; gap: 6px; padding-block: 18px 8px; }
.result-top .big { font-family: var(--font-display); font-weight: 800; font-size: clamp(56px, 16vw, 88px); line-height: 1; }
.stars { display: flex; gap: 6px; }
.stars svg { width: 34px; height: 34px; }
.stars .on { fill: var(--kunyit); } .stars .off { fill: var(--line); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.stats div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stats b { display: block; font-family: var(--font-display); font-size: 24px; }
.newbest { background: var(--kunyit); color: var(--tile-ink); font-weight: 700; border-radius: 999px; padding: 3px 12px; justify-self: start; font-size: 14px; }
.review { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.review li { display: grid; grid-template-columns: 22px minmax(0,1fr) auto; gap: 10px; align-items: baseline; padding: 8px 12px; background: var(--surface); border-radius: 10px; border: 1px solid var(--line); }
.review .mark { font-weight: 800; }
.review .mark.y { color: var(--pandan); } .review .mark.n { color: var(--bad); }
.review .w { font-weight: 700; overflow-wrap: anywhere; }
.review .w small { font-weight: 500; color: var(--muted); display: block; }
.review .tr { color: var(--muted); font-size: 14px; text-align: right; }

.seg { display: grid; grid-template-columns: repeat(2, 1fr); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; padding: 10px 12px; border-radius: 9px; font-weight: 700; color: var(--muted); line-height: 1.2; }
.seg button[aria-pressed="true"] { background: var(--pandan); color: var(--pandan-ink); }

/* scoreboard */
.sb-card { margin-top: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 14px; }
.sb-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sb-head h2 { font-size: 28px; }
.sb-sub { margin: 4px 0 0; color: var(--muted); }
.sb-sub select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px 6px; }
.sb-tabs { flex: 0 1 280px; }
.sb-name { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--bg); border-radius: 14px; padding: 12px 14px; }
.sb-name label { font-weight: 700; }
.sb-name input { flex: 1 1 160px; min-width: 0; font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.sb-msg { margin: 0; font-size: 14px; font-weight: 600; color: var(--pandan); }
.sb-msg.err { color: var(--bad); }
.sb-msg:empty { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn { border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 14px; font-weight: 700; color: var(--muted); }
.chip-btn[aria-pressed="true"] { border-color: var(--pandan); color: var(--pandan); }
.sb-wrap { overflow-x: auto; }
.sb { width: 100%; border-collapse: collapse; }
.sb th { text-align: left; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 2px solid var(--line); white-space: nowrap; }
.sb td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.sb .r { text-align: right; font-variant-numeric: tabular-nums; }
.sb .rk { width: 36px; font-family: var(--font-display); font-weight: 800; color: var(--muted); }
.sb tr.top3 .rk { color: var(--pandan); }
.sb .pl { font-weight: 600; overflow-wrap: anywhere; }
.sb .tt { font-weight: 700; font-size: 14px; color: var(--muted); }
.sb .mt { display: none; }
.sb .best { font-family: var(--font-display); font-weight: 800; font-size: 18px; }
.sb .when { color: var(--muted); font-size: 14px; white-space: nowrap; }
.sb tr.me td { background: var(--kunyit-soft); }
.sb-empty, .sb-note { margin: 0; color: var(--muted); font-size: 14px; }
.credit { margin-top: 28px; display: grid; gap: 14px; text-align: center; color: var(--muted); }
.credit p { margin: 0; }
.credit .by { display: flex; align-items: center; gap: 14px; }
.credit .by::before, .credit .by::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.credit b { color: var(--ink); font-family: var(--font-display); }
@media (max-width: 560px) {
  .sb .tt { display: none; }
  .sb .mt { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
  .sb-card { padding: 16px 14px; }
}

@media (max-width: 480px) {
  .rack .tile { width: 42px; height: 48px; font-size: 22px; }
  .opt { font-size: 17px; padding: 12px 10px; }
  .card { padding: 16px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const VOWELS = 'AEIOU', CONS = 'BCDFGHJKLMNPRSTWY';
const other = l => l === 'ms' ? 'en' : 'ms';
const li = l => l === 'en' ? 1 : 0;
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : String(k));
  return el;
}

// ---------- sound and music (made with Web Audio, no files needed) ----------
const Sound = (() => {
  const pref = (k) => { try { return localStorage.getItem(k) !== 'off'; } catch { return true; } };
  const store = (k, v) => { try { localStorage.setItem(k, v ? 'on' : 'off'); } catch {} };
  let ctx = null, on = pref('kataSprint.sound'), musicOn = pref('kataSprint.music');
  function audio() {
    if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, start, dur, type = 'sine', vol = 0.15, dest = null) {
    const c = audio(); if (!c) return;
    const t0 = start > 1000 ? start : c.currentTime + start; // absolute time when scheduling music
    const osc = c.createOscillator(), gain = c.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(dest || c.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  const sounds = {
    click: () => tone(660, 0, 0.06, 'sine', 0.1),
    tap: () => tone(520 + Math.random() * 80, 0, 0.07, 'triangle', 0.14),
    undo: () => tone(300, 0, 0.07, 'triangle', 0.1),
    correct: () => [523, 659, 784].forEach((f, i) => tone(f, i * 0.07, 0.2, 'triangle', 0.16)),
    wrong: () => { tone(220, 0, 0.18, 'square', 0.06); tone(165, 0.12, 0.26, 'square', 0.06); },
    tick: () => tone(1000, 0, 0.05, 'square', 0.05),
    hint: () => [880, 1175].forEach((f, i) => tone(f, i * 0.06, 0.14, 'sine', 0.12)),
    win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.11, 0.32, 'triangle', 0.16)),
    lose: () => [392, 330, 262].forEach((f, i) => tone(f, i * 0.16, 0.34, 'triangle', 0.14)),
  };

  // background music: a soft C – Am – F – G arpeggio loop
  const EIGHTH = 60 / 92 / 2;
  const PROG = [
    [65.41, [261.63, 329.63, 392.00, 523.25]],
    [55.00, [220.00, 261.63, 329.63, 440.00]],
    [43.65, [174.61, 220.00, 261.63, 349.23]],
    [49.00, [196.00, 246.94, 293.66, 392.00]],
  ];
  const ARP = [0, 1, 2, 3, 2, 1, 2, 1];
  let timer = null, bus = null, next = 0, step = 0;
  function schedule() {
    while (next < ctx.currentTime + 0.3) {
      const [bass, chord] = PROG[Math.floor(step / 8) % 4], i = step % 8;
      if (i === 0) tone(bass * 2, next, EIGHTH * 7.5, 'sine', 0.3, bus);
      tone(chord[ARP[i]], next, EIGHTH * 1.8, 'triangle', 0.12, bus);
      next += EIGHTH; step++;
    }
  }
  function startMusic() {
    if (timer || !musicOn || document.hidden) return;
    const c = audio(); if (!c) return;
    bus = c.createGain(); bus.gain.value = 0.3; bus.connect(c.destination);
    next = c.currentTime + 0.1; step = 0;
    schedule(); timer = setInterval(schedule, 100);
  }
  function stopMusic() {
    clearInterval(timer); timer = null;
    if (bus) { bus.gain.setTargetAtTime(0, ctx.currentTime, 0.08); const b = bus; setTimeout(() => b.disconnect(), 500); bus = null; }
  }
  // browsers only allow audio after the player interacts, so start music on the first tap
  document.addEventListener('pointerdown', startMusic);
  document.addEventListener('keydown', startMusic);
  document.addEventListener('visibilitychange', () => document.hidden ? stopMusic() : (ctx && startMusic()));

  return {
    play(name) { if (on) try { sounds[name](); } catch {} },
    get on() { return on; },
    get music() { return musicOn; },
    toggle() { on = !on; store('kataSprint.sound', on); if (on) sounds.click(); },
    toggleMusic() { musicOn = !musicOn; store('kataSprint.music', musicOn); musicOn ? startMusic() : stopMusic(); },
  };
})();

function audioToggles() {
  const t = ui();
  const music = h('button', { class: 'pill', id: 'music-btn', type: 'button' });
  const sfx = h('button', { class: 'pill', id: 'sfx-btn', type: 'button' });
  const paint = () => {
    music.setAttribute('aria-pressed', String(Sound.music)); music.textContent = Sound.music ? t.musicOn : t.musicOff;
    sfx.setAttribute('aria-pressed', String(Sound.on)); sfx.textContent = Sound.on ? t.soundOn : t.soundOff;
  };
  music.addEventListener('click', () => { Sound.toggleMusic(); paint(); });
  sfx.addEventListener('click', () => { Sound.toggle(); paint(); });

  return h('div', { class: 'toggles' }, music, sfx);
}

// ---------- question generation ----------
function poolFor(lang, lvl, used, extra = () => true) {
  const inRange = (e, lo, hi) => e[lang].length >= lo && e[lang].length <= hi && !used.has(e.id) && extra(e);
  let p = BANK.filter(e => inRange(e, lvl.len[0], lvl.len[1]));
  if (p.length < 6) p = BANK.filter(e => inRange(e, lvl.len[0] - 2, lvl.len[1] + 3));
  if (p.length < 4) p = BANK.filter(e => !used.has(e.id) && extra(e));
  return p;
}
function distractors(target, lang, n, lvl, field) {
  let cands = BANK.filter(e => e.id !== target.id && e[field] !== target[field] && e.ms !== e.en);
  if (lvl.sameCat) {
    const same = shuffle(cands.filter(e => e.cat === target.cat));
    const rest = shuffle(cands.filter(e => e.cat !== target.cat));
    return same.concat(rest).slice(0, n);
  }
  return shuffle(cands).slice(0, n);
}

const GEN = {
  scramble(lang, lvl, used) {
    const e = pick(poolFor(lang, lvl, used));
    const word = e[lang];
    let letters = word.split('');
    for (let i = 0; i < lvl.decoys; i++) letters.push(pick((VOWELS + CONS).split('')));
    let tiles;
    do { tiles = shuffle(letters); } while (tiles.slice(0, word.length).join('') === word && word.length > 1);
    return { type: 'scramble', lang, entry: e, answer: word, tiles };
  },
  missing(lang, lvl, used) {
    const e = pick(poolFor(lang, lvl, used, x => x[lang].length >= 4));
    const word = e[lang];
    const n = Math.min(lvl.hide, word.length - 2);
    const idx = shuffle([...word].map((_, i) => i)).slice(0, n).sort((a, b) => a - b);
    const ans = idx.map(i => word[i]).join('');
    const opts = new Set([ans]);
    let tries = 0;
    while (opts.size < (lvl.opts || 4) && tries++ < 600) {
      const combo = ans.split('').map(c => {
        if (Math.random() < 0.5 && tries < 300) return c;
        return pick((VOWELS.includes(c) ? VOWELS : CONS).split('').filter(x => x !== c));
      }).join('');
      const filled = [...word]; idx.forEach((p, k) => filled[p] = combo[k]);
      if (combo !== ans && !WORDSET[lang].has(filled.join(''))) opts.add(combo);
    }
    return { type: 'missing', lang, entry: e, answer: ans, idx, options: shuffle([...opts]) };
  },
  odd(lang, lvl, used) {
    const lo = Math.max(3, lvl.len[0] - 2);
    const okLen = e => e[lang].length >= lo && !used.has(e.id);
    const byCat = {};
    BANK.filter(okLen).forEach(e => (byCat[e.cat] ||= []).push(e));
    let cats = Object.keys(byCat).filter(c => byCat[c].length >= lvl.odd - 1);
    if (!cats.length) { // not enough long words: fall back to any unused word
      for (const k in byCat) delete byCat[k];
      BANK.filter(e => !used.has(e.id)).forEach(e => (byCat[e.cat] ||= []).push(e));
      cats = Object.keys(byCat).filter(c => byCat[c].length >= lvl.odd - 1);
    }
    const c = pick(cats);
    const group = shuffle(byCat[c]).slice(0, lvl.odd - 1);
    const oddPool = BANK.filter(e => e.cat !== c && okLen(e));
    const odd = pick(oddPool.length ? oddPool : BANK.filter(e => e.cat !== c && !used.has(e.id)));
    const options = shuffle([...group, odd].map(e => e[lang]));
    return { type: 'odd', lang, entry: odd, cat: c, answer: odd[lang], options };
  },
  clue(lang, lvl, used) {
    const e = pick(poolFor(lang, lvl, used));
    const options = shuffle([e, ...distractors(e, lang, (lvl.opts || 4) - 1, lvl, lang)].map(x => x[lang]));
    return { type: 'clue', lang, entry: e, answer: e[lang], options };
  },
  translate(lang, lvl, used) {
    const to = other(lang);
    const e = pick(poolFor(lang, lvl, used, x => x.ms !== x.en));
    const options = shuffle([e, ...distractors(e, to, 3, lvl, to)].map(x => x[to]));
    return { type: 'translate', lang, to, entry: e, answer: e[to], options };
  },
};

function makeRound(lvl, only = null) {
  const types = ['scramble', 'missing', 'odd', 'clue'];
  const seq = only ? Array(PRACTICE).fill(only) : [];
  while (seq.length < ROUND && !only) {
    const block = shuffle(types);
    if (seq.length && block[0] === seq[seq.length - 1]) block.push(block.shift());
    seq.push(...block);
  }
  const used = new Set();
  return seq.slice(0, only ? PRACTICE : ROUND).map(type => {
    const lang = S.lang;
    const q = GEN[type](lang, lvl, used);
    used.add(q.entry.id);
    return q;
  });
}

// ---------- game ----------
const G = {};
function show(id) { for (const s of ['menu', 'game', 'result']) $('#' + s).hidden = s !== id; window.scrollTo(0, 0); }

function startGame(lvl, only = null) {
  Sound.play('click');
  Object.assign(G, {
    lvl, mode: only, qs: makeRound(lvl, only), i: 0, score: 0, lives: lvl.lives, hints: lvl.hints,
    streak: 0, bestStreak: 0, correct: 0, log: [], busy: false,
  });
  show('game');
  renderQuestion();
}

const heart = full => `<svg viewBox="0 0 24 24" aria-hidden="true"><path class="${full ? 'full' : 'empty'}" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.4 2.5h1.8c.8-1.3 2.3-2.5 4.4-2.5 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>`;

function renderQuestion() {
  const t = ui(), q = G.qs[G.i], L = li(q.lang);
  G.busy = false; G.picks = []; G.locked = 0;
  const lvlName = G.lvl.name[uiL()];

  const bar = h('div', { class: 'bar' },
    h('span', { class: 'chip' }, lvlName),
    h('span', { class: 'num' }, `${t.q} ${G.i + 1}/${G.qs.length}`),
    h('div', { class: 'hearts', html: Array.from({ length: G.lvl.lives }, (_, k) => heart(k < G.lives)).join(''), 'aria-label': `${t.lives}: ${G.lives}` }),
    h('span', { class: 'spacer' }),
    h('div', { class: 'stat' }, h('span', { class: 'label' }, t.streak), h('b', { class: 'num' }, `×${G.streak}`)),
    h('div', { class: 'stat' }, h('span', { class: 'label' }, t.score), h('b', { class: 'num', id: 'score' }, G.score)));

  const timer = h('div', { class: 'timer', id: 'timer' }, h('i', { id: 'timer-fill' }));
  const timerRow = h('div', { class: 'timer-row' }, h('span', { id: 'timer-txt', class: 'num' }, ''), h('span', { id: 'penalty' }, ''));

  const [title, instr] = t.types[q.type];
  const card = h('div', { class: 'card', id: 'card' },
    h('div', { class: 'qhead' }, h('span', { class: 'label' }, title), h('p', {}, instr)));

  const clueBox = () => h('div', { class: 'clue' }, h('span', { class: 'label' }, G.lvl.hideCat ? t.clueLbl : `${t.clueLbl} · ${CATS[q.entry.cat][L]}`), L ? q.entry.cen : q.entry.cms);

  if (q.type === 'scramble') {
    card.append(clueBox());
    const n = q.answer.length;
    const slots = h('div', { class: 'slots', id: 'slots', style: `grid-template-columns: repeat(${n}, minmax(0, 48px))` },
      Array.from({ length: n }, (_, k) => h('button', { class: 'slot', 'data-k': k, 'aria-label': `slot ${k + 1}`, onclick: () => unpick(k) })));
    const rack = h('div', { class: 'rack', id: 'rack' },
      q.tiles.map((c, k) => h('button', { class: 'tile', 'data-k': k, onclick: () => pickTile(k) }, c)));
    card.append(slots, rack);
  } else if (q.type === 'missing') {
    card.append(clueBox());
    card.append(h('div', { class: 'prompt-word', id: 'pattern' },
      [...q.entry[q.lang]].map((c, k) => q.idx.includes(k)
        ? h('span', { class: 'tile mini blank', 'data-k': k }, '?')
        : h('span', { class: 'tile mini' }, c))));
    card.append(optionGrid(q.options.map(o => o.split('').join(' · '))));
  } else if (q.type === 'odd') {
    card.append(optionGrid(q.options));
  } else if (q.type === 'clue') {
    card.append(clueBox(), optionGrid(q.options));
  } else if (q.type === 'translate') {
    card.append(h('div', { class: 'prompt-word' }, [...q.entry[q.lang]].map(c => h('span', { class: 'tile mini' }, c))));
    card.append(optionGrid(q.options));
  }

  const hintBtn = h('button', { class: 'btn', id: 'hint-btn', onclick: useHint, disabled: G.hints ? false : 'disabled' }, `${t.hint} (${G.hints})`);
  const quitBtn = h('button', { class: 'btn warn', id: 'quit-btn', onclick: e => {
    const b = e.currentTarget;
    if (b.dataset.armed) { stopTimer(); clearTimeout(G.advTimer); G.busy = false; show('menu'); renderMenu(); return; }
    b.dataset.armed = '1'; b.textContent = t.sure;
    setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = t.quit; } }, 2500);
  } }, t.quit);

    h('div', { style: 'display:flex;flex-wrap:wrap;gap:10px' }, quitBtn, audioToggles()),
    h('div', { style: 'display:flex;gap:10px' },
      q.type === 'scramble' ? h('button', { class: 'btn', id: 'clear-btn', onclick: () => { G.picks = G.picks.slice(0, G.locked); Sound.play('undo'); drawScramble(); } }, t.clear) : null,

function optionGrid(labels) {
  const q = G.qs[G.i];
  const raw = q.type === 'missing' ? q.options : q.options;
  return h('div', { class: 'opts', id: 'opts' }, labels.map((lab, k) =>
    h('button', { class: 'opt', 'data-v': raw[k], onclick: () => choose(raw[k]) }, h('kbd', {}, k + 1), lab)));
}

// scramble interaction
function pickTile(k) {
  const q = G.qs[G.i];
  if (G.busy || G.picks.includes(k) || G.picks.length >= q.answer.length) return;
  G.picks.push(k);
  Sound.play('tap');
  drawScramble();
  if (G.picks.length === q.answer.length) checkScramble();
}
function unpick(k) {
  if (G.busy || k < G.locked || k >= G.picks.length) return;
  G.picks = G.picks.slice(0, k);
  Sound.play('undo');
  drawScramble();
}
function drawScramble() {
  const q = G.qs[G.i];
  document.querySelectorAll('#slots .slot').forEach((s, k) => {
    const p = G.picks[k];
    s.textContent = p != null ? q.tiles[p] : '';
    s.classList.toggle('filled', p != null);
    s.classList.toggle('locked', k < G.locked);
  });
  document.querySelectorAll('#rack .tile').forEach((b, k) => b.disabled = G.picks.includes(k));
}
function checkScramble() {
  const q = G.qs[G.i];
  const word = G.picks.map(p => q.tiles[p]).join('');
  if (word === q.answer) return finish(true);
  const slots = $('#slots');
  slots.classList.remove('shake'); void slots.offsetWidth; slots.classList.add('shake');
  Sound.play('wrong');
  G.deadline -= 3000;
  const pen = $('#penalty'); pen.textContent = ui().penalty; setTimeout(() => { if (pen.isConnected) pen.textContent = ''; }, 900);
  setTimeout(() => { if (!G.busy) { G.picks = G.picks.slice(0, G.locked); drawScramble(); } }, 350);
}

function choose(v) {
  if (G.busy) return;
  const q = G.qs[G.i];
  finish(v === q.answer, false, v);
}

function useHint() {
  if (G.busy || !G.hints) return;
  const q = G.qs[G.i];
  if (q.type === 'scramble') {
    // keep the correct prefix, then place the next correct letter and lock it
    let k = 0;
    while (k < G.picks.length && q.tiles[G.picks[k]] === q.answer[k]) k++;
    G.picks = G.picks.slice(0, k);
    if (k >= q.answer.length) return;
    const tile = q.tiles.findIndex((c, i) => c === q.answer[k] && !G.picks.includes(i));
    G.picks.push(tile);
    G.locked = G.picks.length;
    drawScramble();
    if (G.picks.length === q.answer.length) checkScramble();
  } else {
    const wrong = [...document.querySelectorAll('#opts .opt:not(.gone)')].filter(b => b.dataset.v !== q.answer);
    const remove = q.type === 'missing' ? 2 : 1;
    shuffle(wrong).slice(0, remove).forEach(b => { b.classList.add('gone'); b.disabled = true; });
  }
  Sound.play('hint');
  G.hints--;
  const hb = $('#hint-btn'); hb.textContent = `${ui().hint} (${G.hints})`; hb.disabled = !G.hints;
}

// timer
function startTimer(sec) {
  stopTimer();
  G.dur = sec * 1000; G.lastSec = null; G.deadline = performance.now() + G.dur;
  const fill = $('#timer-fill'), txt = $('#timer-txt'), box = $('#timer');
  const tick = now => {
    const left = Math.max(0, G.deadline - now);
    fill.style.transform = `scaleX(${left / G.dur})`;
    txt.textContent = (left / 1000).toFixed(1) + ui().sec;
    box.classList.toggle('low', left / G.dur < 0.3);
    const secLeft = Math.ceil(left / 1000);
    if (secLeft <= 3 && secLeft > 0 && secLeft !== G.lastSec) { G.lastSec = secLeft; Sound.play('tick'); }
    if (left <= 0) return finish(false, true);
    G.raf = requestAnimationFrame(tick);
  };
  G.raf = requestAnimationFrame(tick);
}
function stopTimer() { cancelAnimationFrame(G.raf); }

function finish(ok, timedOut = false, chosen = null) {
  if (G.busy) return;
  G.busy = true; stopTimer();
  const t = ui(), q = G.qs[G.i], L = li(q.lang);
  const left = Math.max(0, G.deadline - performance.now());
  let pts = 0;
  if (ok) {
    pts = Math.round((100 * G.lvl.mult + 50 * G.lvl.mult * left / G.dur) * (1 + 0.1 * Math.min(G.streak, 10)));
    G.score += pts; G.streak++; G.correct++; G.bestStreak = Math.max(G.bestStreak, G.streak);
  } else {
    G.lives--; G.streak = 0;
  }
  G.log.push({ q, ok });
  Sound.play(ok ? 'correct' : 'wrong');

  // mark the board
  document.querySelectorAll('#opts .opt').forEach(b => {
    b.disabled = true;
    if (b.dataset.v === q.answer) b.classList.add('ok');
    else if (b.dataset.v === chosen) b.classList.add('no');
  });
  document.querySelectorAll('#rack .tile, #slots .slot').forEach(b => b.disabled = true);
  if (q.type === 'missing') document.querySelectorAll('#pattern .blank').forEach(s => {
    s.textContent = q.entry[q.lang][+s.dataset.k]; s.classList.remove('blank'); s.classList.add('reveal');
  });
  if (q.type === 'scramble' && !ok) document.querySelectorAll('#slots .slot').forEach((s, k) => {
    s.textContent = q.answer[k]; s.classList.add('filled');
  });
  $('#score').textContent = G.score;
  document.querySelector('.hearts').innerHTML = Array.from({ length: G.lvl.lives }, (_, k) => heart(k < G.lives)).join('');

  const e = q.entry, o = other(q.lang);
  const pair = q.type === 'odd'
    ? `${e[q.lang]} ${t.notCat} ${CATS[q.cat][uiL()].toLowerCase()}`
    : `${e[q.lang]} = ${e[o]}`;
  const head = ok ? `${t.correct} +${pts}` : (timedOut ? t.timeout : t.wrong);
  const rev = h('div', { class: 'reveal ' + (ok ? 'good' : 'bad'), role: 'status', onclick: advance },
    h('strong', {}, head), h('span', { class: 'pair' }, pair), h('small', {}, t.next));
  $('#card').append(rev);
  $('#card').classList.add(ok ? 'pop' : 'shake');
  G.advTimer = setTimeout(advance, ok ? 1300 : 2200);
}

function advance() {
  clearTimeout(G.advTimer);
  if (!G.busy) return;
  G.i++;
  if (G.lives <= 0 || G.i >= G.qs.length) return renderResult();
  renderQuestion();
}

// ---------- result ----------
const star = on => `<svg viewBox="0 0 24 24" aria-hidden="true"><path class="${on ? 'on' : 'off'}" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>`;
function renderResult() {
  const t = ui(), L = uiL();

  const key = `${S.lang}-${G.lvl.id}`;
  const isBest = !G.mode && G.score > 0 && G.score > (S.best[key] || 0);

  $('#result').replaceChildren(
    h('div', { class: 'result-top' },

      h('div', { class: 'big num' }, G.score),

    h('div', { class: 'stats' },
      h('div', {}, h('span', { class: 'label' }, t.accuracy), h('b', { class: 'num' }, `${G.correct}/${G.qs.length}`)),
      h('div', {}, h('span', { class: 'label' }, t.bestStreak), h('b', { class: 'num' }, `×${G.bestStreak}`)),
      h('div', {}, h('span', { class: 'label' }, t.best), h('b', { class: 'num' }, S.best[key] || 0))),
    h('div', { class: 'actions' },
      h('button', { class: 'btn', id: 'menu-btn', onclick: () => { show('menu'); renderMenu(); } }, t.menuBtn),
      h('button', { class: 'btn primary', id: 'again-btn', onclick: () => startGame(G.lvl, G.mode) }, t.againBtn)),
    db ? scoreboard({ level: 'all', pending: !G.mode && G.score > 0 ? { score: G.score, correct: G.correct, level: G.lvl.id, lang: S.lang } : null }) : null,
    h('div', { class: 'section' },
      h('span', { class: 'label' }, t.review),
      h('ul', { class: 'review' }, G.log.map(({ q, ok }) => {
        const ql = li(q.lang), o = other(q.lang);
        return h('li', {},
          h('span', { class: 'mark ' + (ok ? 'y' : 'n') }, ok ? '✓' : '✗'),
          h('span', { class: 'w' }, q.entry[q.lang], h('small', {}, `${t.types[q.type][0]} · ${CATS[q.entry.cat][L]}`)),
          h('span', { class: 'tr' }, q.entry[o]));
      }))),
    footer(),
  );
  Sound.play(G.lives <= 0 ? 'lose' : 'win');
  show('result');
}

// ---------- shared scoreboard ----------
function loadName() { try { return localStorage.getItem('kataSprint.name') || ''; } catch { return ''; } }
function saveName(n) { try { localStorage.setItem('kataSprint.name', n); } catch {} }

// title earned from the number of correct answers in a player's best game
const RANKS = [
  [12, ['Genius', 'Genius']],
  [10, ['Cemerlang', 'Brilliant']],
  [8, ['Pemikir pantas', 'Quick thinker']],
  [5, ['Bintang baru', 'Rising star']],
  [0, ['Pemula', 'Beginner']],
];
const rankTitle = correct => RANKS.find(([min]) => correct >= min)[1][uiL()];

function timeAgo(iso) {
  const sec = (new Date(iso) - Date.now()) / 1000;
  const rtf = new Intl.RelativeTimeFormat(S.lang, { numeric: 'auto' });
  for (const [unit, size] of [['day', 86400], ['hour', 3600], ['minute', 60]]) {
    if (Math.abs(sec) >= size) return rtf.format(Math.round(sec / size), unit);
  }
  return rtf.format(Math.round(sec), 'second');
}

function scoreboard({ level, pending = null }) {
  const t = ui(), L = uiL();
  const st = { tab: 'top', who: 'all', level, rows: null, error: false, myId: null, req: 0 };
  const box = h('section', { class: 'sb-card', 'aria-label': t.board });
  const msg = h('p', { class: 'sb-msg', role: 'status' });
  const setMsg = (text, err = false) => { msg.textContent = text; msg.classList.toggle('err', err); };

  const input = h('input', { id: 'sb-name', maxlength: '20', placeholder: t.yourName, autocomplete: 'nickname', value: loadName() });
  const nameForm = h('form', { class: 'sb-name', onsubmit: async e => {
    e.preventDefault();
    const name = input.value.trim();
    if (!name) return setMsg(t.nameNeeded, true);
    saveName(name); input.value = name;
    setMsg(t.saved);
    if (await submitPending()) return load();
    draw();
  } }, h('label', { for: 'sb-name' }, t.yourName), input, h('button', { class: 'btn primary', type: 'submit' }, t.save));

  // save the game that just ended, once, as soon as the player has a name
  async function submitPending() {
    const name = loadName();
    if (!pending || pending.done || !name) return false;
    pending.done = true;
    const { data, error } = await db.from('scores')
      .insert({ name, score: pending.score, correct: pending.correct, level: pending.level, lang: pending.lang })
      .select('id').single();
    if (error) { pending.done = false; setMsg(t.lbError, true); return false; }
    st.myId = data.id;
    setMsg(t.sent);
    return true;
  }

  async function load() {
    const req = ++st.req;
    st.rows = null; draw();
    let query = db.from('scores').select('id,name,score,correct,level,lang,created_at');
    if (st.level !== 'all') query = query.eq('level', st.level);
    const { data, error } = await query.order('created_at', { ascending: false }).limit(1000);
    if (req !== st.req) return;
    st.error = !!error; st.rows = data || []; draw();
  }

  function table(heads, rows) {
    return h('div', { class: 'sb-wrap' }, h('table', { class: 'sb' },
      h('thead', {}, h('tr', {}, heads.map(([label, cls]) => h('th', { class: cls || '' }, label)))),
      h('tbody', {}, rows)));
  }

  function draw() {
    const me = loadName().trim().toLowerCase();
    const levelSelect = h('select', { id: 'sb-level', 'aria-label': t.level, onchange: e => { st.level = e.target.value; load(); } },
      [{ id: 'all', name: [t.allLevels, t.allLevels] }, ...LEVELS].map(l => h('option', { value: l.id, selected: l.id === st.level ? 'selected' : false }, l.name[L])));
    const head = h('div', { class: 'sb-head' },
      h('div', {}, h('h2', {}, t.board), h('p', { class: 'sb-sub' }, `${st.tab === 'top' ? t.boardSub : t.recentSub} · `, levelSelect)),
      h('div', { class: 'seg two sb-tabs', role: 'group' }, [['top', t.top], ['recent', t.recent]].map(([id, label]) =>
        h('button', { 'aria-pressed': String(st.tab === id), onclick: () => { st.tab = id; draw(); } }, label))));
    const chips = h('div', { class: 'chips', role: 'group' }, [['all', t.everyone], ['me', t.onlyMe]].map(([id, label]) =>
      h('button', { class: 'chip-btn', 'aria-pressed': String(st.who === id), onclick: () => { st.who = id; draw(); } }, label)));

    // where a score came from, e.g. "Super Sukar · BM"
    const where = r => `${LEVELS.find(l => l.id === r.level)?.name[L] ?? r.level} · ${r.lang === 'en' ? 'EN' : 'BM'}`;
    let body;
    if (st.rows === null) body = h('p', { class: 'sb-empty' }, t.loading);
    else if (st.error) body = h('p', { class: 'sb-empty' }, t.lbError);
    else {
      const rows = st.who === 'me' ? st.rows.filter(r => r.name.trim().toLowerCase() === me) : st.rows;
      if (!rows.length) body = h('p', { class: 'sb-empty' }, t.lbEmpty);
      else if (st.tab === 'top') {
        const players = new Map(); // rows are newest first, so the first name seen is the latest spelling
        for (const r of rows) {
          const k = r.name.trim().toLowerCase(), p = players.get(k);
          if (!p) players.set(k, { key: k, name: r.name, best: r, games: 1 });
          else { p.games++; if (r.score > p.best.score) p.best = r; }
        }
        const list = [...players.values()].sort((a, b) => b.best.score - a.best.score).slice(0, 20);
        body = table([['#'], [t.colPlayer], [t.colTitle, 'tt'], [t.colLevel, 'tt'], [t.colGames, 'r'], [t.colBest, 'r']],
          list.map((p, i) => h('tr', { class: [i < 3 ? 'top3' : '', p.key === me ? 'me' : ''].join(' ') },
            h('td', { class: 'rk' }, i + 1),
            h('td', { class: 'pl' }, p.name, p.key === me ? ` (${t.you})` : '', h('small', { class: 'mt' }, `${rankTitle(p.best.correct)} · ${where(p.best)}`)),
            h('td', { class: 'tt' }, rankTitle(p.best.correct)),
            h('td', { class: 'tt' }, where(p.best)),
            h('td', { class: 'r' }, p.games),
            h('td', { class: 'r best' }, p.best.score))));
      } else {
        body = table([[t.colPlayer], [t.colTitle, 'tt'], [t.colLevel, 'tt'], [t.colScore, 'r'], [t.colWhen, 'r']],
          rows.slice(0, 20).map(r => h('tr', { class: r.id === st.myId ? 'me' : '' },
            h('td', { class: 'pl' }, r.name, h('small', { class: 'mt' }, `${rankTitle(r.correct)} · ${where(r)}`)),
            h('td', { class: 'tt' }, rankTitle(r.correct)),
            h('td', { class: 'tt' }, where(r)),
            h('td', { class: 'r best' }, r.score),
            h('td', { class: 'r when' }, timeAgo(r.created_at)))));
      }
    }
    box.replaceChildren(head, nameForm, msg, chips, body, h('p', { class: 'sb-note' }, me ? t.boardNote : t.noName));
  }

  draw();
  if (pending && loadName()) submitPending().then(load); else load();
  return box;
}

function footer() {
  const t = ui();
  return h('footer', { class: 'credit' },
    h('p', {}, t.tip),
    h('p', { class: 'by' }, h('span', {}, `${t.credit} `, h('b', {}, 'Auji Kamaruddin'))));
}

// ---------- keyboard ----------
document.addEventListener('keydown', e => {
  if ($('#game').hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  const q = G.qs[G.i];
  if (G.busy) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); advance(); } return; }
  if (q.type === 'scramble') {
    const c = e.key.toUpperCase();
    if (/^[A-Z]$/.test(c)) {
      const k = q.tiles.findIndex((x, i) => x === c && !G.picks.includes(i));
      if (k >= 0) pickTile(k);
    } else if (e.key === 'Backspace' && G.picks.length > G.locked) {
      G.picks.pop(); Sound.play('undo'); drawScramble();
    }
  } else if (/^[1-6]$/.test(e.key)) {
    const b = document.querySelectorAll('#opts .opt')[+e.key - 1];
    if (b && !b.disabled) b.click();
  }
});

renderMenu();
</script>
</body>
